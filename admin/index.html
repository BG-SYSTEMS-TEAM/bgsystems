<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | BG Systems</title>
  <!-- Google Fonts & Tailwind CDN for Admin styling -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050505;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-4">

  <!-- Password Gate UI -->
  <div id="password-gate" class="w-full max-w-md glass-panel rounded-[2.5rem] p-8 md:p-10 shadow-2xl transition-all duration-500 scale-100 opacity-100">
    <div class="flex flex-col items-center mb-8">
      <div class="h-16 w-16 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center p-3 mb-4 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#FFD700" class="w-8 h-8 animate-pulse">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <h2 class="text-2xl font-black uppercase tracking-widest text-center">BG SYSTEMS</h2>
      <p class="text-xs text-[#FFD700] uppercase tracking-widest mt-1.5 font-bold">Admin Content Portal</p>
    </div>

    <form id="password-form" class="space-y-6">
      <div>
        <label for="password-input" class="block text-[10px] font-black uppercase tracking-widest text-neutral-400 mb-2">Security Passcode</label>
        <input type="password" id="password-input" placeholder="••••••••" required
          class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#FFD700] transition-all tracking-widest">
      </div>
      <div id="error-message" class="text-xs text-red-500 font-bold uppercase tracking-wider text-center hidden">
        Incorrect Passcode. Try Again.
      </div>
      <button type="submit"
        class="w-full py-4 bg-[#FFD700] text-black font-black uppercase text-xs tracking-widest rounded-2xl hover:scale-[1.02] transition-all shadow-lg flex items-center justify-center gap-2">
        <span>Authenticate</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>
  </div>

  <!-- Script Loader Logic -->
  <script>
    const PASSCODE = 'admin123'; // Passcode to secure the visual editor locally

    const passwordGate = document.getElementById('password-gate');
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password-input');
    const errorMessage = document.getElementById('error-message');

    // Handle authentication success
    function initCMS() {
      // Ensure Netlify Identity knows the primary app domain (required for custom domains)
      window.localStorage.setItem("netlifySiteURL", "https://bgsystems.netlify.app");

      // Remove password gate completely
      passwordGate.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        passwordGate.remove();
        document.body.classList.remove('flex', 'items-center', 'justify-center', 'p-4');
        document.body.className = '';
        
        // Dynamically inject Netlify Identity and Decap CMS scripts
        const identityScript = document.createElement('script');
        identityScript.src = "https://identity.netlify.com/v1/netlify-identity-widget.js";
        document.head.appendChild(identityScript);

        const cmsScript = document.createElement('script');
        cmsScript.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(cmsScript);
      }, 500);
    }

    // Check if already authenticated in this session
    if (sessionStorage.getItem('bg_admin_authenticated') === 'true') {
      initCMS();
    } else {
      passwordForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = passwordInput.value.trim();
        if (value === PASSCODE) {
          sessionStorage.setItem('bg_admin_authenticated', 'true');
          initCMS();
        } else {
          errorMessage.classList.remove('hidden');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    }
  </script>
</body>
</html>
